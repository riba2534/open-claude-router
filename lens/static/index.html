<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Open Claude Router</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔭</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* 现代浅色主题（单主题，不随系统切换） */
:root {
  --bg:#F5F7FA; --surface:#FFFFFF; --surface-2:#F1F4F8; --ink:#17232E; --muted:#5F7285;
  --line:#E4E9F0; --accent:#0C8599; --accent-ink:#09677A; --accent-soft:#E3F3F6;
  --warn:#B25E09; --warn-soft:#FCF0DF; --good:#188349; --good-soft:#E4F4EA;
  --bad:#C23B41; --bad-soft:#FBE9E9; --code-bg:#F4F6F9;
  --shadow:0 1px 2px rgba(23,35,46,.05), 0 2px 8px rgba(23,35,46,.05);
  --shadow-lg:0 2px 4px rgba(23,35,46,.05), 0 8px 24px rgba(23,35,46,.08);
  --sans:"IBM Plex Sans","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:14px; line-height:1.6; }
a { color:var(--accent-ink); text-decoration:none; }
a:hover { text-decoration:underline; }

.topbar { display:flex; align-items:center; gap:20px; padding:12px 24px; background:var(--surface); border-bottom:1px solid var(--line); box-shadow:0 1px 3px rgba(23,35,46,.04); position:sticky; top:0; z-index:5; flex-wrap:wrap; }
.brand { font-weight:700; font-size:17px; letter-spacing:-.01em; display:flex; align-items:center; gap:8px; }
.brand .dot { width:10px; height:10px; border-radius:50%; background:var(--accent); display:inline-block; }
.nav { display:flex; gap:4px; }
.nav a { padding:6px 15px; border-radius:999px; color:var(--muted); font-weight:500; transition:background .15s,color .15s; }
.nav a.on { background:var(--accent-soft); color:var(--accent-ink); }
.nav a:hover { background:var(--surface-2); text-decoration:none; }
.topbar .spacer { flex:1; }
.topbar select, .topbar input[type=text], .filters select, .filters input {
  background:var(--surface); color:var(--ink); border:1px solid var(--line); border-radius:8px;
  padding:6px 10px; font-family:var(--sans); font-size:13px; box-shadow:0 1px 2px rgba(23,35,46,.04);
}
.topbar select:focus, .filters select:focus, .filters input:focus, .topbar input:focus { outline:2px solid var(--accent-soft); border-color:var(--accent); }
.topbar label { font-size:12.5px; color:var(--muted); display:flex; align-items:center; gap:6px; }
.btn { background:var(--accent); color:#fff; border:none; border-radius:8px; padding:7px 16px; font-size:13px; cursor:pointer; font-family:var(--sans); font-weight:500; box-shadow:0 1px 2px rgba(23,35,46,.08); transition:filter .15s; }
.btn:hover { filter:brightness(1.06); }
.btn:disabled { opacity:.45; cursor:default; }
.btn.ghost { background:var(--surface); color:var(--accent-ink); border:1px solid var(--line); box-shadow:0 1px 2px rgba(23,35,46,.04); }
.btn.ghost:hover { background:var(--surface-2); filter:none; }
.btn:focus-visible, a:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }

.wrap { max-width:1280px; margin:0 auto; padding:20px 22px 60px; }
.mono { font-family:var(--mono); }
.num { font-variant-numeric:tabular-nums; }
.muted { color:var(--muted); }

.cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:18px; }
.card { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px 18px; box-shadow:var(--shadow); }
.card .k { font-family:var(--mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
.card .v { font-size:24px; font-weight:600; font-variant-numeric:tabular-nums; margin-top:2px; }
.card .s { font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }

.panel { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:18px 20px; margin-bottom:18px; box-shadow:var(--shadow); }
.panel h3 { margin:0 0 10px; font-size:14.5px; }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
@media (max-width:900px){ .grid2 { grid-template-columns:1fr; } }
.chart-scroll { overflow-x:auto; }
svg.chart { display:block; width:100%; height:auto; }

table.data { width:100%; border-collapse:collapse; font-size:13px; }
table.data th { text-align:left; font-family:var(--mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); padding:8px 10px; background:var(--surface-2); border-bottom:1px solid var(--line); white-space:nowrap; }
table.data th:first-child { border-radius:8px 0 0 8px; }
table.data th:last-child { border-radius:0 8px 8px 0; }
table.data td { padding:7px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
table.data td.mono { white-space:nowrap; }
table.data tr:last-child td { border-bottom:none; }
table.data tr.row { cursor:pointer; }
table.data tr.row:hover { background:var(--surface-2); }
.tbl-scroll { overflow-x:auto; }

.chip { display:inline-block; font-family:var(--mono); font-size:11px; font-weight:600; border-radius:999px; padding:1px 9px; white-space:nowrap; }
.chip.good { background:var(--good-soft); color:var(--good); }
.chip.warn { background:var(--warn-soft); color:var(--warn); }
.chip.bad { background:var(--bad-soft); color:var(--bad); }
.chip.info { background:var(--accent-soft); color:var(--accent-ink); }
.chip.dim { background:var(--surface-2); color:var(--muted); }

.filters { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:14px; }
.pager { display:flex; gap:10px; align-items:center; margin-top:12px; font-size:13px; color:var(--muted); }

.meta-bar { display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:12px 18px; margin-bottom:14px; font-family:var(--mono); font-size:12px; box-shadow:var(--shadow); }
.seg { display:inline-flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; margin-bottom:14px; box-shadow:0 1px 2px rgba(23,35,46,.04); }
.seg button { border:none; background:var(--surface); color:var(--muted); padding:7px 20px; font-size:13px; cursor:pointer; font-family:var(--sans); }
.seg button.on { background:var(--accent); color:#fff; font-weight:600; }
.seg button:not(.on):hover { background:var(--surface-2); }
.block { margin-bottom:14px; min-width:0; }
.block-head { display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:10px 18px; cursor:pointer; box-shadow:var(--shadow); user-select:none; transition:background .15s; }
.block-head:hover { background:var(--surface-2); }
.block-title { font-weight:600; font-size:14px; display:flex; align-items:center; gap:8px; }
.block-title::before { content:""; width:9px; height:9px; border-radius:50%; background:var(--accent); flex:none; }
.block.resp .block-title::before { background:var(--good); }
.block-meta { color:var(--muted); font-family:var(--mono); font-size:11.5px; }
.block-caret { margin-left:auto; color:var(--muted); font-size:12px; }
.block-caret::before { content:"▾ 折叠"; }
.block.folded .block-caret::before { content:"▸ 展开"; }
.block.folded > .block-body { display:none; }
.block-body { margin-top:10px; min-width:0; }

.tabs { display:flex; gap:2px; flex-wrap:wrap; }
.tab { padding:5px 13px; border:1px solid var(--line); border-bottom:none; border-radius:7px 7px 0 0; color:var(--muted); background:var(--surface-2); cursor:pointer; font-size:12.5px; font-family:var(--mono); }
.tab.on { background:var(--surface); color:var(--ink); font-weight:600; border-color:var(--accent); }
.pane { border:1px solid var(--line); border-radius:0 12px 12px 12px; padding:14px; background:var(--surface); min-height:120px; box-shadow:var(--shadow); }

.bubble { border:1px solid var(--line); border-radius:8px; padding:8px 12px; background:var(--surface); margin-bottom:8px; overflow-wrap:anywhere; }
.bubble .role { font-family:var(--mono); font-size:10.5px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; margin-bottom:3px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.bubble.sys { background:var(--surface-2); color:var(--muted); }
.bubble.user { border-left:3px solid var(--accent); }
.bubble.user .role { color:var(--accent-ink); }
.bubble.asst .role { color:var(--good); }
.bubble.think { background:var(--accent-soft); border-style:dashed; color:var(--muted); }
.bubble.tcall { margin-left:18px; border-left:3px solid var(--warn); }
.bubble.tcall .role { color:var(--warn); }
.bubble.tout { margin-left:36px; color:var(--muted); }
.bubble img { max-width:220px; max-height:160px; border-radius:6px; border:1px solid var(--line); display:block; margin:4px 0; }
.bubble pre { margin:4px 0; }
details.fold > summary { cursor:pointer; color:var(--accent-ink); font-size:12px; font-family:var(--mono); list-style:none; }
details.fold > summary::before { content:"▸ "; }
details.fold[open] > summary::before { content:"▾ "; }
pre.code { background:var(--code-bg); border:1px solid var(--line); border-radius:7px; padding:9px 12px; overflow-x:auto; font-size:12px; line-height:1.55; font-family:var(--mono); white-space:pre-wrap; overflow-wrap:anywhere; margin:6px 0; }
.kv { display:grid; grid-template-columns:max-content 1fr; gap:3px 14px; font-size:12.5px; }
.kv .k { font-family:var(--mono); color:var(--muted); }

.usage-wrap { margin:10px 0 4px; }
.usage-row { display:flex; align-items:center; gap:10px; font-family:var(--mono); font-size:11.5px; }
.usage-track { flex:1; height:10px; border-radius:5px; background:var(--surface-2); overflow:hidden; display:flex; }
.usage-track i { display:block; height:100%; }
.u-in { background:var(--accent); }
.u-cache { background:var(--accent); opacity:.35; }
.u-out { background:var(--good); }
.u-think { background:var(--warn); }
.legend { display:flex; gap:14px; font-size:11px; color:var(--muted); font-family:var(--mono); margin-top:4px; flex-wrap:wrap; }
.legend i { display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:4px; vertical-align:-1px; }

.sse-row { border-bottom:1px solid var(--line); padding:4px 2px; font-size:12px; }
.sse-row:last-child { border-bottom:none; }
.sse-row .head { display:flex; gap:10px; cursor:pointer; align-items:baseline; font-family:var(--mono); }
.sse-row .idx { color:var(--muted); min-width:34px; text-align:right; font-size:10.5px; }
.sse-row .ev { color:var(--accent-ink); font-weight:600; font-size:11.5px; white-space:nowrap; }
.sse-row .sum { color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }
.empty { color:var(--muted); text-align:center; padding:40px 0; font-size:13px; }

/* rendered/raw 切换容器（markdown 与 JSON 树共用） */
.tb { position:relative; min-height:20px; }
.tb > .tb-toggle { position:absolute; top:0; right:0; z-index:2; font-family:var(--mono); font-size:10px; font-weight:600; padding:1px 9px; border-radius:999px; border:1px solid var(--line); background:var(--surface); color:var(--muted); cursor:pointer; opacity:.75; transition:all .15s; box-shadow:0 1px 2px rgba(23,35,46,.06); }
.tb:hover > .tb-toggle { opacity:1; border-color:var(--accent); color:var(--accent-ink); }
.tb > .tb-a, .tb > .tb-b { padding-right:52px; }
.tb.clamp > .tb-a, .tb.clamp > .tb-b { position:relative; }
.tb.clamp:not(.open) > .tb-a, .tb.clamp:not(.open) > .tb-b { max-height:250px; overflow:hidden; }
.tb.clamp:not(.open) > .tb-a::after { content:""; position:absolute; bottom:0; left:0; right:0; height:56px; background:linear-gradient(rgba(255,255,255,0), var(--surface)); pointer-events:none; }
.tb.clamp:not(.open) > .tb-b::after { content:""; position:absolute; bottom:0; left:0; right:0; height:56px; background:linear-gradient(rgba(244,246,249,0), var(--code-bg)); pointer-events:none; }
.clamp-more { display:block; text-align:center; font-family:var(--mono); font-size:11.5px; color:var(--accent-ink); cursor:pointer; padding:6px 0 2px; user-select:none; }
.clamp-more:hover { text-decoration:underline; }

/* markdown 渲染 */
.md { line-height:1.65; overflow-wrap:anywhere; }
.md p { margin:0 0 8px; max-width:none; }
.md p:last-child { margin-bottom:0; }
.md h1,.md h2,.md h3,.md h4 { margin:10px 0 6px; line-height:1.35; }
.md h1 { font-size:1.22em; } .md h2 { font-size:1.13em; } .md h3 { font-size:1.05em; } .md h4 { font-size:1em; }
.md ul,.md ol { margin:4px 0 8px; padding-left:1.5em; max-width:none; }
.md li { margin-bottom:2px; }
.md blockquote { border-left:3px solid var(--line); margin:6px 0 8px; padding:2px 12px; color:var(--muted); }
.md pre.code { margin:8px 0; white-space:pre; }
.md table { border-collapse:collapse; margin:8px 0; font-size:.95em; display:block; overflow-x:auto; }
.md th,.md td { border:1px solid var(--line); padding:4px 10px; }
.md th { background:var(--surface-2); font-family:inherit; text-transform:none; letter-spacing:0; }
.md hr { border:none; border-top:1px solid var(--line); margin:10px 0; }
.md a { color:var(--accent-ink); }

/* JSON 树 */
.jt { font-family:var(--mono); font-size:12px; line-height:1.65; overflow-wrap:anywhere; }
.jt-k { color:var(--accent-ink); }
.jt-s { color:var(--good); }
.jt-n { color:var(--warn); }
.jt-b { color:var(--bad); }
.jt-node > .jt-caret { cursor:pointer; user-select:none; display:inline-block; width:1em; color:var(--muted); }
.jt-node > .jt-caret::before { content:"▾"; }
.jt-node.jt-collapsed > .jt-caret::before { content:"▸"; }
.jt-children { display:block; padding-left:1.1em; margin-left:.3em; border-left:1px dotted var(--line); }
.jt-node.jt-collapsed > .jt-children { display:none; }
.jt-badge { display:none; color:var(--muted); font-style:italic; cursor:pointer; padding:0 4px; }
.jt-node.jt-collapsed > .jt-badge { display:inline; }
.jt-more { color:var(--accent-ink); cursor:pointer; font-size:11px; white-space:nowrap; }

.live-dot { width:8px; height:8px; border-radius:50%; background:var(--muted); display:inline-block; transition:background .3s; }
.live-dot.on { background:var(--good); box-shadow:0 0 0 3px var(--good-soft); }
.overlay { position:fixed; inset:0; background:rgba(23,35,46,.45); display:flex; align-items:center; justify-content:center; z-index:50; }
.overlay .box { background:var(--surface); border-radius:16px; box-shadow:var(--shadow-lg); padding:28px 32px; max-width:520px; width:92%; }
.overlay h3 { margin:0 0 6px; font-size:17px; }
.overlay p { color:var(--muted); font-size:13px; margin:0 0 14px; }
.overlay input[type=password], .overlay input[type=text] { width:100%; box-sizing:border-box; padding:9px 12px; border:1px solid var(--line); border-radius:8px; font-size:14px; margin-bottom:12px; background:var(--surface); color:var(--ink); }
.overlay textarea { width:100%; box-sizing:border-box; height:200px; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font-family:var(--mono); font-size:11.5px; background:var(--code-bg); color:var(--ink); white-space:pre; overflow:auto; margin-bottom:12px; }
.overlay .row { display:flex; gap:10px; justify-content:flex-end; }
.err-note { background:var(--bad-soft); color:var(--bad); border-radius:7px; padding:8px 12px; font-size:12.5px; margin-bottom:8px; overflow-wrap:anywhere; }
.warn-note { background:var(--warn-soft); color:var(--warn); border-radius:7px; padding:8px 12px; font-size:12.5px; margin-bottom:8px; }
h2.vh { font-size:18px; margin:6px 0 14px; }
</style>
</head>
<body>
<div class="topbar">
  <span class="brand"><span class="dot"></span>Open Claude Router</span>
  <nav class="nav">
    <a href="#/" id="nav-overview">总览</a>
    <a href="#/requests" id="nav-requests">请求</a>
    <a href="#/sessions" id="nav-sessions">会话</a>
  </nav>
  <span class="spacer"></span>
  <span class="live-dot" id="live-dot" title="实时流连接状态"></span>
  <label>时间窗
    <select id="hours">
      <option value="1">1 小时</option>
      <option value="6">6 小时</option>
      <option value="24" selected>24 小时</option>
      <option value="168">7 天</option>
      <option value="720">30 天</option>
    </select>
  </label>
  <label><input type="checkbox" id="auto" checked> 自动刷新</label>
  <button class="btn ghost" id="refresh">刷新</button>
</div>
<div class="wrap" id="view"></div>

<script>
"use strict";
const $view = document.getElementById("view");
const $hours = document.getElementById("hours");
const $auto = document.getElementById("auto");
let timer = null;

/* ---------- helpers ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtInt = n => n == null ? "–" : Number(n).toLocaleString("en-US");
const fmtMs = n => n == null ? "–" : n >= 10000 ? (n/1000).toFixed(1)+"s" : fmtInt(n)+"ms";
const fmtBytes = n => n == null ? "–" : n >= 1048576 ? (n/1048576).toFixed(1)+" MB" : n >= 1024 ? (n/1024).toFixed(1)+" KB" : n+" B";
const fmtTime = ts => { if(!ts) return "–"; const d = new Date(ts); return d.toLocaleString("zh-CN",{hour12:false,month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit"}); };
const shortId = id => id ? id.slice(0,8) : "–";
const clientLabel = r => r.client_tag || r.client_ip || "–";
const pretty = v => { try { return JSON.stringify(typeof v === "string" ? JSON.parse(v) : v, null, 2); } catch { return String(v); } };
const fmtUSD = v => {
  if(v == null) return "–";
  if(v === 0) return "$0";
  if(v < 0.01) return "$" + v.toFixed(5).replace(/0+$/,"").replace(/\.$/,"");
  if(v < 1) return "$" + v.toFixed(4).replace(/0+$/,"").replace(/\.$/,"");
  return "$" + v.toFixed(2);
};
const fmtDur = s => { if(s == null) return "–"; if(s < 60) return s + "s"; if(s < 3600) return Math.round(s/60) + "m"; return (s/3600).toFixed(1) + "h"; };
const getToken = () => localStorage.getItem("lens_token") || "";
async function api(path){
  const r = await fetch(path, {headers: getToken() ? {"X-Lens-Token": getToken()} : {}});
  if(r.status === 401){ showLogin(); throw new Error("需要访问令牌"); }
  if(!r.ok) throw new Error(path + " -> " + r.status);
  return r.json();
}

/* ---------- auth overlay ---------- */
function showLogin(){
  if(document.getElementById("login-overlay")) return;
  const div = document.createElement("div");
  div.className = "overlay"; div.id = "login-overlay";
  div.innerHTML = `<div class="box">
    <h3>需要访问令牌</h3>
    <p>该看板已启用鉴权（LENS_ACCESS_TOKEN）。输入令牌后保存在本浏览器。</p>
    <input type="password" id="login-token" placeholder="访问令牌" autofocus>
    <div class="row"><button class="btn" id="login-go">进入</button></div>
  </div>`;
  document.body.appendChild(div);
  const submit = () => {
    localStorage.setItem("lens_token", document.getElementById("login-token").value.trim());
    div.remove(); connectStream(true); route();
  };
  document.getElementById("login-go").onclick = submit;
  document.getElementById("login-token").onkeydown = e => { if(e.key === "Enter") submit(); };
}

/* ---------- clipboard modal (clipboard API needs https; show selectable fallback) ---------- */
function showCopyModal(title, text){
  const div = document.createElement("div");
  div.className = "overlay";
  div.innerHTML = `<div class="box" style="max-width:760px">
    <h3>${esc(title)}</h3>
    <textarea readonly id="copy-text"></textarea>
    <div class="row"><button class="btn ghost" id="copy-close">关闭</button><button class="btn" id="copy-do">复制</button></div>
  </div>`;
  document.body.appendChild(div);
  const area = div.querySelector("#copy-text");
  area.value = text;
  div.querySelector("#copy-close").onclick = () => div.remove();
  div.addEventListener("click", e => { if(e.target === div) div.remove(); });
  div.querySelector("#copy-do").onclick = async () => {
    area.select();
    let ok = false;
    try { await navigator.clipboard.writeText(text); ok = true; } catch {}
    if(!ok){ try { ok = document.execCommand("copy"); } catch {} }
    div.querySelector("#copy-do").textContent = ok ? "已复制 ✓" : "复制失败，请手动全选";
  };
}

/* ---------- live stream (SSE) ---------- */
let es = null, streamTimer = null;
function connectStream(force){
  if(es && !force) return;
  if(es){ es.close(); es = null; }
  const dot = document.getElementById("live-dot");
  const url = "/api/stream" + (getToken() ? "?token=" + encodeURIComponent(getToken()) : "");
  try { es = new EventSource(url); } catch { return; }
  es.onopen = () => dot.classList.add("on");
  es.onerror = () => { dot.classList.remove("on"); };
  es.onmessage = () => {
    // 收到任何新事件：对当前列表类视图做去抖重渲染（详情页不动）
    if((location.hash || "#/").startsWith("#/r/")) return;
    clearTimeout(streamTimer);
    streamTimer = setTimeout(route, 400);
  };
}

function outcomeChip(row){

  if(o === "ok"){
    const tail = row.protocol_complete === 0 && row.stream ? " · 流截断" : "";
    return `<span class="chip good">${row.status || 200}${tail}</span>`;
  }
  if(o === "http_error") return `<span class="chip bad">${row.status || "ERR"}</span>`;
  if(o === "transport_error") return `<span class="chip bad">transport</span>`;
  if(o === "cancelled") return `<span class="chip warn">取消·${esc((row.cancel_stage||"").includes("waiting")?"等响应":"读流中")}</span>`;
  return `<span class="chip dim">pending</span>`;
}

/* ---------- markdown renderer（自带，无外部依赖；先整体转义再变换） ---------- */
function mdInline(s){
  return s
    .replace(/`([^`\n]+)`/g, (m, c) => `<code>${c}</code>`)
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[\s（(>])\*([^*\n]+)\*(?=[\s，。．,.:;）)]|$)/g, "$1<em>$2</em>");
}
function renderMd(src){
  src = String(src ?? "").replace(/\r\n?/g, "\n");
  const codes = [];
  src = src.replace(/```[^\n`]*\n([\s\S]*?)(?:```|$)/g, (m, body) => {
    codes.push(`<pre class="code"><code>${esc(body.replace(/\n$/, ""))}</code></pre>`);
    return `\u0000${codes.length - 1}\u0000`;
  });
  src = esc(src);
  const lines = src.split("\n");
  const out = [];
  let para = [], list = null; // list: {tag, items}
  const flushPara = () => { if(para.length){ out.push(`<p>${para.map(mdInline).join("<br>")}</p>`); para = []; } };
  const flushList = () => { if(list){ out.push(`<${list.tag}>${list.items.map(i => `<li>${mdInline(i)}</li>`).join("")}</${list.tag}>`); list = null; } };
  const isTableSep = l => /^\s*\|?[\s:|-]+\|?\s*$/.test(l) && l.includes("-");
  const splitRow = l => l.replace(/^\s*\|/, "").replace(/\|\s*$/, "").split("|").map(c => mdInline(c.trim()));
  for(let i = 0; i < lines.length; i++){
    const line = lines[i];
    let m;
    if(/^\s*$/.test(line)){ flushPara(); flushList(); continue; }
    if((m = line.match(/^(#{1,4})\s+(.+)$/))){ flushPara(); flushList(); out.push(`<h${m[1].length}>${mdInline(m[2])}</h${m[1].length}>`); continue; }
    if(/^\s*(---+|\*\*\*+)\s*$/.test(line)){ flushPara(); flushList(); out.push("<hr>"); continue; }
    if((m = line.match(/^&gt;\s?(.*)$/))){ flushPara(); flushList();
      const quote = [m[1]];
      while(i + 1 < lines.length && (m = lines[i + 1].match(/^&gt;\s?(.*)$/))){ quote.push(m[1]); i++; }
      out.push(`<blockquote>${quote.map(mdInline).join("<br>")}</blockquote>`); continue; }
    if((m = line.match(/^\s*[-*+]\s+(.+)$/))){ flushPara(); if(!list || list.tag !== "ul"){ flushList(); list = {tag:"ul", items:[]}; } list.items.push(m[1]); continue; }
    if((m = line.match(/^\s*\d+[.)]\s+(.+)$/))){ flushPara(); if(!list || list.tag !== "ol"){ flushList(); list = {tag:"ol", items:[]}; } list.items.push(m[1]); continue; }
    if(line.includes("|") && i + 1 < lines.length && isTableSep(lines[i + 1])){
      flushPara(); flushList();
      const head = splitRow(line); i++;
      const rows = [];
      while(i + 1 < lines.length && lines[i + 1].includes("|") && !/^\s*$/.test(lines[i + 1])){ rows.push(splitRow(lines[i + 1])); i++; }
      out.push(`<table><tr>${head.map(c => `<th>${c}</th>`).join("")}</tr>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</table>`);
      continue;
    }
    para.push(line);
  }
  flushPara(); flushList();
  return out.join("").replace(/\u0000(\d+)\u0000/g, (m, i) => codes[Number(i)]);
}

/* ---------- JSON 树（语法高亮 + 节点折叠） ---------- */
const JT_STR_SHORT = 200, JT_STR_HARD = 100000;
function jtString(s){
  if(s.length <= JT_STR_SHORT) return `<span class="jt-s">${esc(JSON.stringify(s))}</span>`;
  const short = `<span class="jt-str-short">${esc(JSON.stringify(s.slice(0, JT_STR_SHORT)).slice(0, -1))}…"</span>`;
  if(s.length > JT_STR_HARD)
    return `<span class="jt-s">${short}</span> <span class="muted" style="font-size:11px">(${fmtInt(s.length)} 字符，过长仅显示开头，完整内容见 RAW)</span>`;
  return `<span class="jt-s jt-strwrap">${short}<span class="jt-str-full" hidden>${esc(JSON.stringify(s))}</span></span> <span class="jt-more">展开 ${fmtInt(s.length)} 字符</span>`;
}
function jsonTree(v, depth){
  depth = depth || 0;
  if(v === null) return `<span class="jt-b">null</span>`;
  if(typeof v === "string") return jtString(v);
  if(typeof v === "number") return `<span class="jt-n">${v}</span>`;
  if(typeof v === "boolean") return `<span class="jt-b">${v}</span>`;
  const isArr = Array.isArray(v);
  const entries = isArr ? v.map((x, i) => [i, x]) : Object.entries(v);
  if(!entries.length) return isArr ? "[]" : "{}";
  const collapsed = depth >= 3 || entries.length > 40;
  const rows = entries.map(([k, val], i) =>
    `<div class="jt-row">${isArr ? "" : `<span class="jt-k">${esc(JSON.stringify(String(k)))}</span>: `}${jsonTree(val, depth + 1)}${i < entries.length - 1 ? "," : ""}</div>`
  ).join("");
  return `<span class="jt-node${collapsed ? " jt-collapsed" : ""}"><span class="jt-caret"></span>${isArr ? "[" : "{"}<span class="jt-badge">… ${entries.length} 项</span><span class="jt-children">${rows}</span>${isArr ? "]" : "}"}</span>`;
}

/* ---------- 双视图块：渲染视图 + RAW，右上角切换 ---------- */
function mdBlock(text){
  return `<div class="tb" data-alt="RAW"><button class="tb-toggle">RAW</button><div class="tb-a md">${renderMd(text)}</div><pre class="code tb-b" hidden>${esc(text)}</pre></div>`;
}
function jsonBlock(source, maxHeight){
  const style = maxHeight ? ` style="max-height:${maxHeight}px;overflow-y:auto"` : "";
  let value;
  try { value = typeof source === "string" ? JSON.parse(source) : source; } catch {}
  if(value === undefined) return `<pre class="code"${style}>${esc(String(source ?? ""))}</pre>`;
  const raw = typeof source === "string" ? pretty(source) : JSON.stringify(source, null, 2);
  return `<div class="tb" data-alt="RAW"><button class="tb-toggle">RAW</button><div class="tb-a jt"${style}>${jsonTree(value)}</div><pre class="code tb-b" hidden${style}>${esc(raw)}</pre></div>`;
}
document.addEventListener("click", e => {
  const caret = e.target.closest(".jt-caret, .jt-badge");
  if(caret){ caret.closest(".jt-node").classList.toggle("jt-collapsed"); return; }
  const more = e.target.closest(".jt-more");
  if(more){
    const wrap = more.previousElementSibling;
    const short = wrap.querySelector(".jt-str-short"), full = wrap.querySelector(".jt-str-full");
    const showFull = full.hidden;
    full.hidden = !showFull; short.hidden = showFull;
    more.textContent = showFull ? "收起" : more.dataset.label || "展开";
    if(!more.dataset.label) more.dataset.label = "展开";
    return;
  }
  const blockHead = e.target.closest(".block-head");
  if(blockHead){ blockHead.parentElement.classList.toggle("folded"); return; }
  const clampMore = e.target.closest(".clamp-more");
  if(clampMore){
    const open = clampMore.parentElement.classList.toggle("open");
    clampMore.textContent = open ? "收起 ▴" : clampMore.dataset.label;
    return;
  }
  const toggle = e.target.closest(".tb-toggle");
  if(toggle){
    const tb = toggle.parentElement;
    const a = tb.querySelector(":scope > .tb-a"), b = tb.querySelector(":scope > .tb-b");
    const showRaw = b.hidden;
    b.hidden = !showRaw; a.hidden = showRaw;
    toggle.textContent = showRaw ? (a.classList.contains("jt") ? "树" : "MD") : "RAW";
  }
});

function textBlock(text, limit){
  const t = String(text ?? "");
  const clamp = t.length > (limit || 700);
  return `<div class="tb${clamp ? " clamp" : ""}"><button class="tb-toggle">RAW</button><div class="tb-a md">${renderMd(t)}</div><pre class="code tb-b" hidden>${esc(t)}</pre>${clamp ? `<div class="clamp-more" data-label="展开全部 · ${fmtInt(t.length)} 字符 ▾">展开全部 · ${fmtInt(t.length)} 字符 ▾</div>` : ""}</div>`;
}
function jsonFold(label, value){
  return `<details class="fold"><summary>${esc(label)}</summary>${jsonBlock(value)}</details>`;
}

/* ---------- charts ---------- */
function stackChart(series, keys, colors, height, hours){
  if(!series || !series.length) return `<div class="empty">窗口内暂无数据</div>`;
  const W = Math.max(660, series.length * 14), H = height || 150;
  let max = 1;
  for(const p of series){ let s = 0; for(const k of keys) s += p[k] || 0; if(s > max) max = s; }
  const pad = Math.max(30, fmtInt(max).length * 6.5 + 10);
  const slot = (W - pad) / series.length;
  const bw = Math.min(26, Math.max(3, Math.floor(slot) - 2));
  let bars = "";
  series.forEach((p, i) => {
    let y = H - 18;
    const x = pad + i * slot + (slot - bw) / 2;
    const label = new Date(p.t * 1000).toLocaleString("zh-CN",{hour12:false,month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"});
    let tip = label;
    keys.forEach((k, ki) => {
      const v = p[k] || 0; tip += ` · ${k}:${fmtInt(v)}`;
      if(v <= 0) return;
      const h = Math.max(1, (v / max) * (H - 30));
      y -= h;
      bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw}" height="${h.toFixed(1)}" fill="${colors[ki]}" rx="1"><title>${esc(tip)}</title></rect>`;
    });
  });
  const gridY = [0, .5, 1].map(f => { const y = (H - 18) - f * (H - 30);
    return `<line x1="${pad}" y1="${y}" x2="${W}" y2="${y}" stroke="currentColor" opacity=".12"/>` +
      `<text x="${pad - 5}" y="${y + 3}" font-size="9" text-anchor="end" fill="currentColor" opacity=".55">${fmtInt(Math.round(f * max))}</text>`; }).join("");
  const t0 = series[0].t, t1 = series[series.length - 1].t;
  const fmtX = t => new Date(t * 1000).toLocaleString("zh-CN", hours > 48 ? {month:"2-digit",day:"2-digit"} : {hour12:false,hour:"2-digit",minute:"2-digit"});
  return `<div class="chart-scroll"><svg class="chart" viewBox="0 0 ${W} ${H}" style="min-width:${Math.min(W,660)}px">${gridY}${bars}
    <text x="${pad}" y="${H - 4}" font-size="9" fill="currentColor" opacity=".55">${fmtX(t0)}</text>
    <text x="${W - 2}" y="${H - 4}" font-size="9" text-anchor="end" fill="currentColor" opacity=".55">${fmtX(t1)}</text></svg></div>`;
}

    </div>

    <div class="panel" style="padding:6px 10px"><div class="tbl-scroll"><table class="data">
      <tr><th>#</th><th>时间</th><th>协议</th><th>结果</th><th>耗时</th><th>in/out tk</th><th>费用</th><th>预览</th></tr>
      ${rows.map((r, i) => `<tr class="row" data-id="${esc(r.request_id)}">
        <td class="num muted">${i + 1}</td>

        <td>${fmtChip(r.format)}${streamChip(r.stream)}</td>
        <td>${outcomeChip(r)}</td>
        <td class="num">${fmtMs(r.duration_ms)}</td>
        <td class="num">${r.input_tokens != null ? fmtInt(r.input_tokens)+" / "+fmtInt(r.output_tokens) : "–"}</td>
        <td class="num">${fmtUSD(r.cost_usd)}</td>
        <td class="muted" style="max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.preview || r.cancel_stage || "")}</td>

  $view.querySelectorAll("tr.row[data-id]").forEach(tr => tr.onclick = () => { location.hash = "#/r/" + tr.dataset.id; });
}

/* ---------- request reconstruction ---------- */
function renderContentParts(parts){
  if(typeof parts === "string") return textBlock(parts);
  if(!Array.isArray(parts)) return jsonFold("content", parts);
  // 连续文本段合并渲染为一个块，避免每段各带一个 RAW 按钮堆叠
  const out = [];
  let buf = [];
  const flush = () => { if(buf.length){ out.push(textBlock(buf.join("\n\n"))); buf = []; } };
  for(const p of parts){
    const type = p.type || "";
    if(type === "text" || type === "input_text" || type === "output_text"){ buf.push(p.text ?? ""); continue; }
    flush();
    if(type === "image_url" || type === "input_image"){
      const url = typeof p.image_url === "string" ? p.image_url : (p.image_url && p.image_url.url) || "";
      const size = url.startsWith("data:") ? ` <span class="chip info">🖼 ${fmtBytes(Math.round(url.length * 0.75))}</span>` : "";
      out.push(url ? `<div><img src="${esc(url)}" alt="请求图片" loading="lazy">${size}</div>` : jsonFold("image", p));
    } else if(type === "refusal"){
      out.push(`<div class="err-note">refusal: ${esc(p.refusal || "")}</div>`);
    } else {
      out.push(jsonFold(type || "part", p));
    }
  }
  flush();
  return out.join("");
}
function toolCallCard(name, args, id){
  return `<div class="bubble tcall"><div class="role">tool_call · ${esc(name || "?")} ${id ? `<span class="muted">${esc(String(id).slice(0,14))}</span>` : ""}</div><pre class="code">${esc(pretty(args))}</pre></div>`;
}
function renderChatConversation(p){
  let html = "";
  for(const m of p.messages || []){
    const role = m.role;
    if(role === "system" || role === "developer"){
      const text = typeof m.content === "string" ? m.content : JSON.stringify(m.content);
      html += `<div class="bubble sys"><div class="role">${esc(role)} <span class="muted">${fmtBytes(text.length)}</span></div>${textBlock(text, 400)}</div>`;
    } else if(role === "tool"){
      const text = typeof m.content === "string" ? m.content : JSON.stringify(m.content);
      html += `<div class="bubble tout"><div class="role">tool result · ${esc(String(m.tool_call_id||"").slice(0,14))}</div>${textBlock(text, 400)}</div>`;
    } else {
      html += `<div class="bubble ${role === "user" ? "user" : "asst"}"><div class="role">${esc(role)}</div>${m.content != null ? renderContentParts(m.content) : ""}</div>`;
      for(const c of m.tool_calls || []) html += toolCallCard(c.function && c.function.name, c.function && c.function.arguments, c.id);
    }
  }
  return html || `<div class="empty">无 messages</div>`;
}
function renderResponsesConversation(p){
  let html = "";
  if(p.instructions){
    html += `<div class="bubble sys"><div class="role">instructions <span class="muted">${fmtBytes(p.instructions.length)}</span></div>${textBlock(p.instructions, 400)}</div>`;
  }
  const items = Array.isArray(p.input) ? p.input : [];
  if(typeof p.input === "string") html += `<div class="bubble user"><div class="role">user</div>${textBlock(p.input)}</div>`;
  for(const item of items){
    const type = item.type || (item.role ? "message" : "");
    if(type === "message"){
      const role = item.role || "user";
      html += `<div class="bubble ${role === "user" ? "user" : role === "system" || role === "developer" ? "sys" : "asst"}"><div class="role">${esc(role)}</div>${renderContentParts(item.content)}</div>`;
    } else if(type === "function_call"){
      html += toolCallCard(item.name, item.arguments, item.call_id);
    } else if(type === "function_call_output"){
      const out = typeof item.output === "string" ? item.output : JSON.stringify(item.output);
      html += `<div class="bubble tout"><div class="role">function_call_output · ${esc(String(item.call_id||"").slice(0,14))}</div>${textBlock(out, 400)}</div>`;
    } else if(type === "reasoning"){
      const text = (item.summary || []).map(s => s.text || "").join("\n");
      html += `<div class="bubble think"><div class="role">reasoning</div>${text ? textBlock(text, 400) : jsonFold("reasoning item", item)}</div>`;
    } else {
      html += `<div class="bubble">${jsonFold(type || "item", item)}</div>`;
    }
  }
  return html || `<div class="empty">无 input</div>`;
}
function renderToolDefs(p, format){
  const tools = p.tools || [];
  if(!tools.length) return `<div class="empty">该请求未携带工具定义</div>`;
  return tools.map(t => {
    const fn = format === "chat-completions" ? (t.function || t) : t;
    const schema = fn.parameters || fn.input_schema;
    return `<div class="bubble"><div class="role">${esc(fn.name || t.type || "?")} ${fn.strict ? '<span class="chip info">strict</span>' : ""}</div>
      ${fn.description ? `<div style="font-size:12.5px;color:var(--muted)">${textBlock(fn.description, 320)}</div>` : ""}
      ${schema ? jsonFold("参数 schema", schema) : ""}</div>`;
  }).join("");
}

/* ---------- Anthropic（Claude 视角）渲染 ---------- */
function anthropicImage(b){
  const source = b.source || {};
  const url = source.type === "base64" ? `data:${source.media_type};base64,${source.data}`
    : source.type === "url" ? source.url : "";
  if(!url) return jsonFold("image", b);
  const size = source.data ? ` <span class="chip info">🖼 ${fmtBytes(Math.round(source.data.length * 0.75))}</span>` : "";
  return `<div><img src="${esc(url)}" alt="请求图片" loading="lazy">${size}</div>`;
}
function renderAnthropicMessage(m){
  const role = m.role || "user";
  const content = typeof m.content === "string" ? [{type:"text", text:m.content}] : (m.content || []);
  const inner = [], after = [];
  let textBuf = [];
  const flushText = () => { if(textBuf.length){ inner.push(textBlock(textBuf.join("\n\n"))); textBuf = []; } };
  for(const b of content){
    if(b.type === "text"){ textBuf.push(b.text ?? ""); continue; }
    flushText();
    switch(b.type){
      case "image": inner.push(anthropicImage(b)); break;
      case "thinking": if((b.thinking || "").trim()) inner.push(`<div class="bubble think"><div class="role">thinking</div>${textBlock(b.thinking, 400)}</div>`); break;
      case "redacted_thinking": inner.push(`<div class="bubble think"><div class="role">redacted_thinking</div><span class="muted">（内容已加密省略）</span></div>`); break;
      case "tool_use": after.push(toolCallCard(b.name, b.input, b.id)); break;
      case "tool_result": {
        const body = typeof b.content === "string" ? textBlock(b.content, 400)
          : (b.content || []).map(x => x.type === "text" ? textBlock(x.text, 400) : x.type === "image" ? anthropicImage(x) : jsonFold(x.type || "block", x)).join("");
        after.push(`<div class="bubble tout"><div class="role">tool_result · ${esc(String(b.tool_use_id || "").slice(0, 16))}${b.is_error ? ' <span class="chip bad">error</span>' : ""}</div>${body}</div>`);
        break;
      }
      default: inner.push(jsonFold(b.type || "block", b));
    }
  }
  flushText();
  const bubble = inner.length ? `<div class="bubble ${role === "user" ? "user" : "asst"}"><div class="role">${esc(role)}</div>${inner.join("")}</div>` : "";
  return bubble + after.join("");
}
function renderAnthropicConversation(p){
  let html = "";
  if(p.system){
    const text = typeof p.system === "string" ? p.system
      : Array.isArray(p.system) ? p.system.map(x => x.text || "").join("\n") : JSON.stringify(p.system);
    html += `<div class="bubble sys"><div class="role">system <span class="muted">${fmtBytes(text.length)}</span></div>${textBlock(text, 400)}</div>`;
  }
  for(const m of p.messages || []) html += renderAnthropicMessage(m);
  return html || `<div class="empty">无 messages</div>`;
}
function renderAnthropicResponse(resp){
  let html = renderAnthropicMessage({role:"assistant", content: resp.content});
  const u = resp.usage || {};
  const meta = [
    resp.stop_reason ? `stop_reason: ${resp.stop_reason}` : null,
    u.input_tokens != null ? `in ${fmtInt(u.input_tokens)}` : null,
    u.cache_read_input_tokens ? `cache_read ${fmtInt(u.cache_read_input_tokens)}` : null,
    u.output_tokens != null ? `out ${fmtInt(u.output_tokens)}` : null,
  ].filter(Boolean).join(" · ");
  if(meta) html += `<div class="muted mono" style="font-size:11px;margin-top:6px">${esc(meta)}</div>`;
  return html || `<div class="empty">无内容</div>`;
}
function renderParams(p){
  const skip = new Set(["messages","input","tools","instructions","system"]);
  const rows = Object.entries(p).filter(([k]) => !skip.has(k)).map(([k, v]) =>
    `<div class="k">${esc(k)}</div><div class="mono" style="overflow-wrap:anywhere">${esc(typeof v === "object" ? JSON.stringify(v) : String(v))}</div>`).join("");
  return rows ? `<div class="kv">${rows}</div>` : `<div class="empty">无其他参数</div>`;
}

/* ---------- response reconstruction ---------- */
function usageBar(d){
  const inTok = d.input_tokens || 0, out = d.output_tokens || 0, cache = d.cached_tokens || 0, think = d.reasoning_tokens || 0;
  const total = inTok + out;
  if(!total) return "";
  const seg = (v, cls) => v > 0 ? `<i class="${cls}" style="width:${(100 * v / total).toFixed(2)}%"></i>` : "";
  return `<div class="usage-wrap"><div class="usage-row"><span>tokens</span><span class="usage-track">${seg(inTok - cache,"u-in")}${seg(cache,"u-cache")}${seg(out - think,"u-out")}${seg(think,"u-think")}</span><span class="num">${fmtInt(total)}</span></div>
  <div class="legend"><span><i class="u-in"></i>input ${fmtInt(inTok - cache)}</span><span><i class="u-cache"></i>cached ${fmtInt(cache)}</span><span><i class="u-out"></i>output ${fmtInt(out - think)}</span><span><i class="u-think"></i>reasoning ${fmtInt(think)}</span></div></div>`;
}
function renderAggChat(agg){
  const choice = (agg.choices || [])[0] || {};
  const msg = choice.message || {};
  let html = "";
  if(msg.reasoning_content) html += `<div class="bubble think"><div class="role">reasoning</div>${textBlock(msg.reasoning_content, 500)}</div>`;
  if(msg.content) html += `<div class="bubble asst"><div class="role">assistant ${choice.finish_reason ? `<span class="chip good">${esc(choice.finish_reason)}</span>` : ""}</div>${textBlock(msg.content, 4000)}</div>`;
  for(const c of msg.tool_calls || []) html += toolCallCard(c.function && c.function.name, c.function && c.function.arguments, c.id);
  if(msg.refusal) html += `<div class="err-note">refusal: ${esc(msg.refusal)}</div>`;
  return html || `<div class="empty">无输出内容</div>`;
}
function renderAggResponses(agg){
  let html = "";
  for(const item of agg.output || []){
    const type = item.type;
    if(type === "reasoning"){
      const text = (item.summary || []).map(s => s.text || "").join("\n\n");
      if(text) html += `<div class="bubble think"><div class="role">reasoning summary</div>${textBlock(text, 500)}</div>`;
    } else if(type === "message"){
      html += `<div class="bubble asst"><div class="role">assistant ${agg.status ? `<span class="chip good">${esc(agg.status)}</span>` : ""}</div>${renderContentParts(item.content)}</div>`;
    } else if(type === "function_call"){
      html += toolCallCard(item.name, item.arguments, item.call_id);
    } else {
      html += `<div class="bubble">${jsonFold(type || "output item", item)}</div>`;
    }
  }
  return html || `<div class="empty">无输出内容</div>`;
}
function parseSse(raw){
  const events = [];
  let ev = null, data = [];
  for(const line of String(raw).split(/\r?\n/)){
    if(line === ""){ if(ev !== null || data.length) events.push({event: ev, data: data.join("\n")}); ev = null; data = []; continue; }
    if(line.startsWith("event:")) ev = line.slice(6).trim();
    else if(line.startsWith("data:")) data.push(line.slice(5).trim());
  }
  if(ev !== null || data.length) events.push({event: ev, data: data.join("\n")});
  return events;
}
function sseLabel(e, format){
  if(e.event) return e.event;
  if(e.data === "[DONE]") return "[DONE]";
  try {
    const d = JSON.parse(e.data);
    const delta = d.choices && d.choices[0] && d.choices[0].delta || {};
    if(delta.tool_calls) return "delta.tool_calls";
    if(delta.reasoning_content) return "delta.reasoning";
    if(delta.content != null) return "delta.content";
    if(d.choices && d.choices[0] && d.choices[0].finish_reason) return "finish:" + d.choices[0].finish_reason;
    if(d.usage) return "usage";
    return "chunk";
  } catch { return "data"; }
}
function sseSummary(e){
  if(e.data === "[DONE]") return "";
  try {
    const d = JSON.parse(e.data);
    const delta = d.choices && d.choices[0] && d.choices[0].delta;
    if(delta){
      if(delta.content) return JSON.stringify(delta.content);
      if(delta.reasoning_content) return JSON.stringify(delta.reasoning_content);
      if(delta.tool_calls){ const c = delta.tool_calls[0] || {}; return (c.function && (c.function.name || "")) + " " + JSON.stringify((c.function && c.function.arguments) || ""); }
    }
    if(d.delta != null) return JSON.stringify(d.delta);
    if(typeof d.text === "string") return JSON.stringify(d.text);
    if(d.item && d.item.type) return "item: " + d.item.type + (d.item.name ? " · " + d.item.name : "");
    if(d.response && d.response.status) return "status: " + d.response.status;
    if(d.usage) return "usage " + JSON.stringify(d.usage);
    return e.data.slice(0, 100);
  } catch { return e.data.slice(0, 100); }
}
function renderSseTimeline(raw, format){
  const events = parseSse(raw);
  if(!events.length) return `<div class="empty">响应体不是 SSE 流</div>`;
  const groups = [];
  // 相邻同类 delta 折叠成一组，避免几百行同名事件刷屏
  for(const e of events){
    const label = sseLabel(e, format);
    const last = groups[groups.length - 1];
    const isDelta = label.startsWith("delta") || label.endsWith(".delta");
    if(last && last.label === label && isDelta) { last.items.push(e); }
    else groups.push({label, items: [e]});
  }
  let index = 0;
  return `<div>` + groups.map(g => {
    const first = g.items[0];
    const count = g.items.length;
    const start = index; index += count;
    const mergeable = g.label.startsWith("delta") || g.label.endsWith(".delta");
    const merged = mergeable ? g.items.map(sseSummary).map(s => { try { return JSON.parse(s); } catch { return s; } }).join("") : sseSummary(first);
    return `<div class="sse-row"><div class="head" onclick="this.nextElementSibling.hidden=!this.nextElementSibling.hidden">
        <span class="idx">${start}${count > 1 ? "–" + (start + count - 1) : ""}</span>
        <span class="ev">${esc(g.label)}${count > 1 ? " ×" + count : ""}</span>
        <span class="sum">${esc(String(merged).slice(0, 160))}</span></div>
      <pre class="code" hidden>${esc(g.items.slice(0, 50).map(e => (e.event ? "event: " + e.event + "\n" : "") + "data: " + e.data).join("\n\n"))}${count > 50 ? "\n\n… 其余 " + (count - 50) + " 条略" : ""}</pre></div>`;
  }).join("") + `</div>`;
}

/* ---------- detail view ---------- */
function activateTabs(root){
  root.querySelectorAll(".tabs").forEach(tabs => {
    tabs.querySelectorAll(".tab").forEach(tab => tab.onclick = () => {
      tabs.querySelectorAll(".tab").forEach(x => x.classList.remove("on"));
      tab.classList.add("on");
      const wrap = tabs.parentElement;
      wrap.querySelectorAll(":scope > .pane").forEach(p => p.hidden = p.dataset.pane !== tab.dataset.tab);
    });
  });
}
async function renderDetail(id){
  const d = await api(`/api/requests/${id}`);
  let reqJson = null, aggJson = null, clientJson = null, anthJson = null;
  try { reqJson = d.req_body ? JSON.parse(d.req_body) : null; } catch {}
  try { aggJson = d.agg_response ? JSON.parse(d.agg_response) : null; } catch {}
  try { clientJson = d.client_req_body ? JSON.parse(d.client_req_body) : null; } catch {}
  try { anthJson = d.anthropic_response ? JSON.parse(d.anthropic_response) : null; } catch {}
  const format = d.format || "chat-completions";
  const isResponses = format === "responses";

  const convo = reqJson ? (isResponses ? renderResponsesConversation(reqJson) : renderChatConversation(reqJson))
    : `<div class="warn-note">请求正文不可用${d.req_truncated ? "（已被截断——调大 OCR_MODEL_LOG_MAX_BODY_BYTES）" : "（metadata 模式或该行丢失）"}</div>`;
  const agg = aggJson ? (isResponses ? renderAggResponses(aggJson) : renderAggChat(aggJson))
    : d.outcome === "ok" ? `<div class="warn-note">未能聚合出终态（流被取消/截断，可看事件流原始视图）</div>` : "";

  let respNotes = "";

  if(d.outcome === "transport_error") respNotes += `<div class="err-note">传输错误：${esc(d.error_message || "")}</div>`;
  if(d.outcome === "cancelled") respNotes += `<div class="warn-note">客户端取消 · 阶段 ${esc(d.cancel_stage || "?")} · ${fmtMs(d.duration_ms)}</div>`;
  if(d.outcome === "ok" && d.stream && d.protocol_complete === 0) respNotes += `<div class="warn-note">HTTP 200 但未收到协议终态（流中断）</div>`;
  if(d.resp_truncated) respNotes += `<div class="warn-note">响应正文超出捕获上限已截断（${fmtBytes(d.resp_bytes)} 实际）</div>`;

  const claudeConvo = clientJson ? renderAnthropicConversation(clientJson)

  const claudeResp = anthJson ? renderAnthropicResponse(anthJson)

  $view.innerHTML = `

      <span class="muted">req</span><span>${esc(d.request_id)}</span>
      ${fmtChip(d.format)}${streamChip(d.stream)}
      ${outcomeChip(d)}
      <span class="chip ${d.route_mode === "header" ? "dim" : "warn"}">${esc(d.route_mode || "")}</span>
      <span class="num">${fmtMs(d.duration_ms)}</span>
      <span class="num">${fmtUSD(d.cost_usd)}</span>
      <span class="mono muted">${esc(d.model || "")}</span>
      <span class="mono muted">${esc(d.client_tag || d.client_ip || "")}${d.client_tag && d.client_ip ? ` <span class="muted" style="font-size:11px">(${esc(d.client_ip)})</span>` : ""} → ${esc((d.upstream_url || "").replace(/^https?:\/\//, ""))}</span>
      <span class="num muted">${fmtTime(d.ts)}</span>
      ${d.session_key ? `<a href="#/s/${esc(d.session_key)}" class="chip info">↗ 所属会话</a>` : ""}
      <button class="btn ghost" id="replay-curl" style="padding:3px 12px;font-size:12px">重放 curl</button>
    </div>
    <div class="seg" id="pv-seg">
      <button class="on" data-pv="router">Router ↔ 网关 · OpenAI 协议</button>
      <button data-pv="claude">Claude ↔ Router · Anthropic 协议</button>
    </div>
    <div id="pv-router">
    <section class="block">
      <div class="block-head"><span class="block-title">请求 · Router → 网关</span><span class="block-meta">${fmtBytes(d.req_bytes)} · OpenAI ${esc(format)}</span><span class="block-caret"></span></div>
      <div class="block-body">
        <div class="tabs">
          <span class="tab on" data-tab="convo">会话视图</span>

    </section>
    <section class="block resp">
      <div class="block-head"><span class="block-title">响应 · 网关 → Router</span><span class="block-meta">${fmtBytes(d.resp_bytes)}${d.stream ? " · SSE" : ""}</span><span class="block-caret"></span></div>
      <div class="block-body">
        <div class="tabs">
          <span class="tab on" data-tab="agg">聚合终态</span>
          <span class="tab" data-tab="sse">事件流</span>
          <span class="tab" data-tab="rawresp">原始</span>
        </div>
        <div class="pane" data-pane="agg">${respNotes}${agg}${usageBar(d)}
          ${d.finish_reason ? `<div class="muted mono" style="font-size:11px;margin-top:6px">finish: ${esc(d.finish_reason)} · complete=${d.complete} · protocol_complete=${d.protocol_complete}</div>` : ""}</div>
        <div class="pane" data-pane="sse" hidden>${d.resp_body && d.stream ? renderSseTimeline(d.resp_body, format) : `<div class="empty">非流式响应，无事件流</div>`}</div>
        <div class="pane" data-pane="rawresp" hidden>
          ${d.resp_headers ? `<div class="muted mono" style="font-size:11px;margin-bottom:4px">headers</div>${jsonBlock(d.resp_headers)}` : ""}
          <div class="muted mono" style="font-size:11px;margin:6px 0 4px">上游原始响应体 · ${fmtBytes(d.resp_bytes)}</div>
          ${!d.resp_body ? `<div class="empty">(无)</div>` : d.stream ? `<pre class="code">${esc(d.resp_body.length > 200000 ? d.resp_body.slice(0,200000) + "\n\n…（截断显示）" : d.resp_body)}</pre>` : jsonBlock(d.resp_body)}
        </div>
      </div>
    </section>
    </div>
    <div id="pv-claude" hidden>
    <section class="block">
      <div class="block-head"><span class="block-title">请求 · Claude → Router</span><span class="block-meta">${d.client_req_body ? fmtBytes(d.client_req_body.length) : "未记录"} · Anthropic Messages</span><span class="block-caret"></span></div>
      <div class="block-body">
        <div class="tabs">
          <span class="tab on" data-tab="c-convo">会话视图</span>
          <span class="tab" data-tab="c-tools">工具 (${clientJson && clientJson.tools ? clientJson.tools.length : 0})</span>
          <span class="tab" data-tab="c-params">参数</span>
          <span class="tab" data-tab="c-raw">原始 JSON</span>
        </div>
        <div class="pane" data-pane="c-convo">${claudeConvo}</div>
        <div class="pane" data-pane="c-tools" hidden>${clientJson ? renderToolDefs(clientJson, "anthropic") : ""}</div>
        <div class="pane" data-pane="c-params" hidden>${clientJson ? renderParams(clientJson) : ""}</div>
        <div class="pane" data-pane="c-raw" hidden><div class="muted mono" style="font-size:11px;margin-bottom:6px">客户端发来的原始 Anthropic 请求</div>${d.client_req_body ? jsonBlock(d.client_req_body) : `<div class="empty">(无)</div>`}</div>
      </div>
    </section>
    <section class="block resp">
      <div class="block-head"><span class="block-title">响应 · Router → Claude</span><span class="block-meta">Anthropic ${anthJson ? "已还原" : "不可用"}</span><span class="block-caret"></span></div>
      <div class="block-body">
        <div class="tabs">
          <span class="tab on" data-tab="c-resp">返回给客户端</span>
          <span class="tab" data-tab="c-rawresp">原始 JSON</span>
        </div>
        <div class="pane" data-pane="c-resp">${claudeResp}${anthJson ? usageBar(d) : ""}</div>
        <div class="pane" data-pane="c-rawresp" hidden><div class="muted mono" style="font-size:11px;margin-bottom:6px">Anthropic 协议响应（流式为聚合终态等价形式，由 Router 同款转换代码重放生成）</div>${d.anthropic_response ? jsonBlock(d.anthropic_response) : `<div class="empty">(无)</div>`}</div>
      </div>
    </section>
    </div>`;
  activateTabs($view);
  document.querySelectorAll("#pv-seg button").forEach(btn => btn.onclick = () => {
    document.querySelectorAll("#pv-seg button").forEach(x => x.classList.remove("on"));
    btn.classList.add("on");
    document.getElementById("pv-router").hidden = btn.dataset.pv !== "router";
    document.getElementById("pv-claude").hidden = btn.dataset.pv !== "claude";
  });
  const replay = document.getElementById("replay-curl");
  if(replay) replay.onclick = () => {
    if(!d.req_body || !d.upstream_url){
      showCopyModal("无法生成重放命令", "该请求缺少已记录的正文或上游地址（metadata 模式或截断）。");
      return;
    }
    const body = d.req_body.replace(/'/g, "'\\''");
    const command = [
      "# 重放发往模型网关的原始请求（先 export UPSTREAM_TOKEN=<上游鉴权值>）",
      `curl -N '${d.upstream_url}' \\`,
      "  -H 'content-type: application/json' \\",
      "  -H 'accept: application/json, text/event-stream' \\",
      '  -H "authorization: $UPSTREAM_TOKEN" \\',
      `  --data-raw '${body}'`,
    ].join("\n");
    showCopyModal("重放上游请求", command);
  };
}

/* ---------- router ---------- */
async function route(){
  const hash = location.hash || "#/";
  document.getElementById("nav-overview").classList.toggle("on", hash === "#/" || hash === "");
  document.getElementById("nav-requests").classList.toggle("on", hash.startsWith("#/requests") || hash.startsWith("#/r/"));
  document.getElementById("nav-sessions").classList.toggle("on", hash.startsWith("#/sessions") || hash.startsWith("#/s/"));
  try {
    if(hash.startsWith("#/r/")) await renderDetail(hash.slice(4));
    else if(hash.startsWith("#/requests")) await renderList();
    else if(hash.startsWith("#/s/")) await renderSessionDetail(hash.slice(4));
    else if(hash.startsWith("#/sessions")) await renderSessions();
    else await renderOverview();
  } catch(err) {
    if(!document.getElementById("login-overlay"))
      $view.innerHTML = `<div class="err-note">加载失败：${esc(err.message)}</div>`;
  }
}
// SSE 是主要的实时通道；轮询降级为 15s 兜底（SSE 断开时仍能更新）
function schedule(){
  if(timer) clearInterval(timer);
  timer = setInterval(() => {
    if(!$auto.checked) return;
    const hash = location.hash || "#/";
    if(hash.startsWith("#/r/")) return; // 详情页不自动刷新
    route();
  }, 15000);
}
window.addEventListener("hashchange", route);
$hours.addEventListener("change", route);
document.getElementById("refresh").addEventListener("click", route);
route(); schedule(); connectStream();
</script>
</body>
</html>
