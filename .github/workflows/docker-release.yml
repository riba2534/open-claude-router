name: Publish Docker image

on:
  push:
    tags:
      - "*"

permissions:
  contents: read

concurrency:
  group: docker-release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKER_IMAGE: riba2534/open-claude-router

jobs:
  validate:
    name: Validate Rust release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate tag and Cargo version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version="$(sed -n '/^\[package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' rust/Cargo.toml | head -n 1)"
          semver_re='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "${tag_version}" =~ ${semver_re} ]]; then
            echo "Release tag must be SemVer, optionally prefixed with v." >&2
            exit 1
          fi
          if [[ "${tag_version}" != "${cargo_version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match rust/Cargo.toml version ${cargo_version}." >&2
            exit 1
          fi

      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup default 1.97.1

      - name: Check formatting
        run: cargo fmt --manifest-path rust/Cargo.toml -- --check

      - name: Lint
        run: cargo clippy --locked --manifest-path rust/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Run unit and integration tests
        run: cargo test --locked --manifest-path rust/Cargo.toml --all-targets

      - name: Build release binary
        run: cargo build --locked --release --manifest-path rust/Cargo.toml

  build:
    name: Build ${{ matrix.platform }} natively
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            artifact: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            artifact: arm64
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.DOCKER_IMAGE }}
          flavor: latest=false
          labels: |
            org.opencontainers.image.title=open-claude-router
            org.opencontainers.image.description=Stateless Rust Anthropic Messages to OpenAI protocol router

      - name: Build and push platform image by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          pull: true
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.DOCKER_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=release-${{ matrix.artifact }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.artifact }}
          provenance: mode=max
          sbom: true

      - name: Export platform digest
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          test "${IMAGE_DIGEST}" != ""
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${IMAGE_DIGEST#sha256:}"

      - name: Upload platform digest
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: digests-${{ matrix.artifact }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish multi-platform manifest
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download platform digests
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: digests-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Classify release tag
        id: release
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "stable=true" >> "${GITHUB_OUTPUT}"
          else
            echo "stable=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.DOCKER_IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ steps.release.outputs.stable == 'true' }}
          labels: |
            org.opencontainers.image.title=open-claude-router
            org.opencontainers.image.description=Stateless Rust Anthropic Messages to OpenAI protocol router

      - name: Create multi-platform manifest
        shell: bash
        env:
          PUBLISHED_TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST_DIR: ${{ runner.temp }}/digests
        run: |
          declare -a create_args=()
          while IFS= read -r image_tag; do
            [[ -z "${image_tag}" ]] && continue
            create_args+=(--tag "${image_tag}")
          done <<< "${PUBLISHED_TAGS}"

          shopt -s nullglob
          digest_files=("${DIGEST_DIR}"/*)
          if (( ${#digest_files[@]} != 2 )); then
            echo "Expected exactly two platform digests, found ${#digest_files[@]}." >&2
            exit 1
          fi
          for digest_file in "${digest_files[@]}"; do
            create_args+=("${DOCKER_IMAGE}@sha256:$(basename "${digest_file}")")
          done

          docker buildx imagetools create "${create_args[@]}"

      - name: Verify published manifest
        shell: bash
        env:
          PUBLISHED_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          expected_digest=""
          while IFS= read -r image_tag; do
            [[ -z "${image_tag}" ]] && continue
            actual_digest="$(docker buildx imagetools inspect "${image_tag}" --format '{{.Manifest.Digest}}')"
            if [[ -z "${expected_digest}" ]]; then
              expected_digest="${actual_digest}"
            elif [[ "${actual_digest}" != "${expected_digest}" ]]; then
              echo "${image_tag} resolved to ${actual_digest}, expected ${expected_digest}." >&2
              exit 1
            fi
          done <<< "${PUBLISHED_TAGS}"

          if [[ -z "${expected_digest}" ]]; then
            echo "No published image tags were generated." >&2
            exit 1
          fi

          raw_manifest="$(docker buildx imagetools inspect "${DOCKER_IMAGE}@${expected_digest}" --raw)"
          runnable="$(jq -r '.manifests[] | select(.platform.os == "linux") | select(.platform.architecture != null) | select(.annotations["vnd.docker.reference.type"] != "attestation-manifest") | "\(.platform.os)/\(.platform.architecture)"' <<< "${raw_manifest}")"
          for expected in linux/amd64 linux/arm64; do
            if ! grep -Fxq "${expected}" <<< "${runnable}"; then
              echo "Published manifest is missing ${expected}." >&2
              exit 1
            fi
          done

          attestations="$(jq '[.manifests[] | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest")] | length' <<< "${raw_manifest}")"
          if (( attestations < 2 )); then
            echo "Published manifest is missing per-platform attestations." >&2
            exit 1
          fi
