name: Publish release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKER_IMAGE: riba2534/open-claude-router

jobs:
  validate:
    name: Validate Rust release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate tag and Cargo version
        id: version
        shell: bash
        run: |
          cargo_version="$(sed -n '/^\[package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' rust/Cargo.toml | head -n 1)"
          semver_re='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "${cargo_version}" =~ ${semver_re} ]]; then
            echo "rust/Cargo.toml version must be SemVer." >&2
            exit 1
          fi

          if [[ "${GITHUB_EVENT_NAME}" = "push" ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [[ ! "${tag_version}" =~ ${semver_re} ]]; then
              echo "Release tag must be SemVer, optionally prefixed with v." >&2
              exit 1
            fi
            if [[ "${tag_version}" != "${cargo_version}" ]]; then
              echo "Tag ${GITHUB_REF_NAME} does not match rust/Cargo.toml version ${cargo_version}." >&2
              exit 1
            fi
            release_version="${GITHUB_REF_NAME}"
          else
            release_version="v${cargo_version}"
          fi
          echo "release_version=${release_version}" >> "${GITHUB_OUTPUT}"

      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup default 1.97.1

      - name: Check formatting
        run: cargo fmt --manifest-path rust/Cargo.toml -- --check

      - name: Lint
        run: cargo clippy --locked --manifest-path rust/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Run unit and integration tests
        run: cargo test --locked --manifest-path rust/Cargo.toml --all-targets

      - name: Build release binary
        run: cargo build --locked --release --manifest-path rust/Cargo.toml

  build-binaries:
    name: Build binary for ${{ matrix.platform }} natively
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            runner_arch: X64
            target: x86_64-unknown-linux-musl
            artifact: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            runner_arch: ARM64
            target: aarch64-unknown-linux-musl
            artifact: linux-arm64
          - platform: macos/amd64
            runner: macos-26-intel
            runner_arch: X64
            target: x86_64-apple-darwin
            artifact: macos-amd64
          - platform: macos/arm64
            runner: macos-26
            runner_arch: ARM64
            target: aarch64-apple-darwin
            artifact: macos-arm64
          - platform: windows/amd64
            runner: windows-2025
            runner_arch: X64
            target: x86_64-pc-windows-msvc
            artifact: windows-amd64
          - platform: windows/arm64
            runner: windows-11-arm
            runner_arch: ARM64
            target: aarch64-pc-windows-msvc
            artifact: windows-arm64
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Confirm native Unix runner architecture
        if: runner.os != 'Windows'
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.runner_arch }}
        run: test "${RUNNER_ARCH}" = "${EXPECTED_ARCH}"

      - name: Confirm native Windows runner architecture
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          EXPECTED_ARCH: ${{ matrix.runner_arch }}
        run: |
          if ($env:RUNNER_ARCH -ne $env:EXPECTED_ARCH) {
            throw "Expected $env:EXPECTED_ARCH runner, got $env:RUNNER_ARCH"
          }

      - name: Install Rust toolchain on Unix
        if: runner.os != 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          rustup target add "${TARGET}"

      - name: Install Rust toolchain on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          rustup target add $env:TARGET

      - name: Install musl tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools

      - name: Build Unix binary
        if: runner.os != 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --locked --release --manifest-path rust/Cargo.toml --target "${TARGET}"

      - name: Build Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --locked --release --manifest-path rust/Cargo.toml --target $env:TARGET

      - name: Smoke test Unix binary
        if: runner.os != 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          binary="rust/target/${TARGET}/release/open-claude-router"
          test -x "${binary}"
          if [[ "${RUNNER_OS}" = "Linux" ]]; then
            file "${binary}" | grep -Eq 'statically linked|static-pie linked'
          fi

          OCR_MODEL_LOG_MODE=off PORT=3457 "${binary}" >"${RUNNER_TEMP}/binary.log" 2>&1 &
          server_pid=$!
          cleanup() {
            kill "${server_pid}" >/dev/null 2>&1 || true
            wait "${server_pid}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if response="$(curl --fail --silent --show-error http://127.0.0.1:3457/healthz)"; then
              test "${response}" = '{"status":"ok"}'
              exit 0
            fi
            sleep 1
          done

          cat "${RUNNER_TEMP}/binary.log" >&2
          exit 1

      - name: Smoke test Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          $binary = "rust/target/$env:TARGET/release/open-claude-router.exe"
          if (-not (Test-Path $binary)) { throw "Missing binary: $binary" }
          $env:OCR_MODEL_LOG_MODE = "off"
          $env:PORT = "3457"
          $process = Start-Process -FilePath $binary -PassThru -NoNewWindow `
            -RedirectStandardOutput "$env:RUNNER_TEMP/binary.stdout.log" `
            -RedirectStandardError "$env:RUNNER_TEMP/binary.stderr.log"
          try {
            foreach ($attempt in 1..30) {
              try {
                $response = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:3457/healthz"
                if ($response.StatusCode -eq 200 -and $response.Content -eq '{"status":"ok"}') { exit 0 }
              } catch {}
              Start-Sleep -Seconds 1
            }
            Get-Content "$env:RUNNER_TEMP/binary.stdout.log" -ErrorAction SilentlyContinue
            Get-Content "$env:RUNNER_TEMP/binary.stderr.log" -ErrorAction SilentlyContinue
            throw "Binary health check failed"
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Package Unix archive
        if: runner.os != 'Windows'
        shell: bash
        env:
          ARTIFACT: ${{ matrix.artifact }}
          RELEASE_VERSION: ${{ needs.validate.outputs.release_version }}
          TARGET: ${{ matrix.target }}
        run: |
          package_name="open-claude-router-${RELEASE_VERSION}-${ARTIFACT}"
          package_dir="${RUNNER_TEMP}/package/${package_name}"
          release_dir="${RUNNER_TEMP}/release"
          mkdir -p "${package_dir}" "${release_dir}"
          cp "rust/target/${TARGET}/release/open-claude-router" "${package_dir}/"
          cp LICENSE README.md "${package_dir}/"
          tar -C "$(dirname "${package_dir}")" -czf "${release_dir}/${package_name}.tar.gz" "${package_name}"

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ARTIFACT: ${{ matrix.artifact }}
          RELEASE_VERSION: ${{ needs.validate.outputs.release_version }}
          TARGET: ${{ matrix.target }}
        run: |
          $packageName = "open-claude-router-$env:RELEASE_VERSION-$env:ARTIFACT"
          $packageDir = Join-Path $env:RUNNER_TEMP "package/$packageName"
          $releaseDir = Join-Path $env:RUNNER_TEMP "release"
          New-Item -ItemType Directory -Force -Path $packageDir, $releaseDir | Out-Null
          Copy-Item "rust/target/$env:TARGET/release/open-claude-router.exe" $packageDir
          Copy-Item LICENSE, README.md $packageDir
          Compress-Archive -Path $packageDir -DestinationPath (Join-Path $releaseDir "$packageName.zip")

      - name: Upload binary archive
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-${{ matrix.artifact }}
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build ${{ matrix.platform }} natively
    if: github.event_name == 'push'
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            artifact: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            artifact: arm64
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.DOCKER_IMAGE }}
          flavor: latest=false
          labels: |
            org.opencontainers.image.title=open-claude-router
            org.opencontainers.image.description=Stateless Rust Anthropic Messages to OpenAI protocol router

      - name: Build and push platform image by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          pull: true
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.DOCKER_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=release-${{ matrix.artifact }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.artifact }}
          provenance: mode=max
          sbom: true

      - name: Export platform digest
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          test "${IMAGE_DIGEST}" != ""
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${IMAGE_DIGEST#sha256:}"

      - name: Upload platform digest
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: digests-${{ matrix.artifact }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish multi-platform manifest
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download platform digests
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: digests-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Classify release tag
        id: release
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "stable=true" >> "${GITHUB_OUTPUT}"
          else
            echo "stable=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.DOCKER_IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ steps.release.outputs.stable == 'true' }}
          labels: |
            org.opencontainers.image.title=open-claude-router
            org.opencontainers.image.description=Stateless Rust Anthropic Messages to OpenAI protocol router

      - name: Create multi-platform manifest
        shell: bash
        env:
          PUBLISHED_TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST_DIR: ${{ runner.temp }}/digests
        run: |
          declare -a create_args=()
          while IFS= read -r image_tag; do
            [[ -z "${image_tag}" ]] && continue
            create_args+=(--tag "${image_tag}")
          done <<< "${PUBLISHED_TAGS}"

          shopt -s nullglob
          digest_files=("${DIGEST_DIR}"/*)
          if (( ${#digest_files[@]} != 2 )); then
            echo "Expected exactly two platform digests, found ${#digest_files[@]}." >&2
            exit 1
          fi
          for digest_file in "${digest_files[@]}"; do
            create_args+=("${DOCKER_IMAGE}@sha256:$(basename "${digest_file}")")
          done

          docker buildx imagetools create "${create_args[@]}"

      - name: Verify published manifest
        shell: bash
        env:
          PUBLISHED_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          expected_digest=""
          while IFS= read -r image_tag; do
            [[ -z "${image_tag}" ]] && continue
            actual_digest="$(docker buildx imagetools inspect "${image_tag}" --format '{{.Manifest.Digest}}')"
            if [[ -z "${expected_digest}" ]]; then
              expected_digest="${actual_digest}"
            elif [[ "${actual_digest}" != "${expected_digest}" ]]; then
              echo "${image_tag} resolved to ${actual_digest}, expected ${expected_digest}." >&2
              exit 1
            fi
          done <<< "${PUBLISHED_TAGS}"

          if [[ -z "${expected_digest}" ]]; then
            echo "No published image tags were generated." >&2
            exit 1
          fi

          raw_manifest="$(docker buildx imagetools inspect "${DOCKER_IMAGE}@${expected_digest}" --raw)"
          runnable="$(jq -r '.manifests[] | select(.platform.os == "linux") | select(.platform.architecture != null) | select(.annotations["vnd.docker.reference.type"] != "attestation-manifest") | "\(.platform.os)/\(.platform.architecture)"' <<< "${raw_manifest}")"
          for expected in linux/amd64 linux/arm64; do
            if ! grep -Fxq "${expected}" <<< "${runnable}"; then
              echo "Published manifest is missing ${expected}." >&2
              exit 1
            fi
          done

          attestations="$(jq '[.manifests[] | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest")] | length' <<< "${raw_manifest}")"
          if (( attestations < 2 )); then
            echo "Published manifest is missing per-platform attestations." >&2
            exit 1
          fi

  github-release:
    name: Publish GitHub Release
    if: github.event_name == 'push'
    needs:
      - build-binaries
      - publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download binary archives
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: release-*
          path: ${{ runner.temp }}/release
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        env:
          RELEASE_DIR: ${{ runner.temp }}/release
        run: |
          archive_count="$(find "${RELEASE_DIR}" -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l)"
          test "${archive_count}" = "6"
          (
            cd "${RELEASE_DIR}"
            sha256sum ./*.tar.gz ./*.zip > SHA256SUMS
          )

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DIR: ${{ runner.temp }}/release
        run: |
          shopt -s nullglob
          assets=("${RELEASE_DIR}"/*.tar.gz "${RELEASE_DIR}"/*.zip "${RELEASE_DIR}/SHA256SUMS")
          if (( ${#assets[@]} != 7 )); then
            echo "Expected six archives and SHA256SUMS, found ${#assets[@]} assets." >&2
            exit 1
          fi

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
          else
            declare -a release_args=(
              "${GITHUB_REF_NAME}"
              "${assets[@]}"
              --verify-tag
              --title "open-claude-router ${GITHUB_REF_NAME}"
              --generate-notes
            )
            if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
              release_args+=(--prerelease)
            fi
            gh release create "${release_args[@]}"
          fi
